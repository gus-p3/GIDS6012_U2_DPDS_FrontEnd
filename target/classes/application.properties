spring.application.name=Ejercicio5Cliente
server.port=${PORT:8080}

# Puedes usar backend.base-url o mantener app.api.url apuntando a BACKEND_URL
backend.base-url=${BACKEND_URL:http://localhost:8081}
app.api.url=${BACKEND_URL:http://localhost:8081}

# Salud (healthcheck de Railway) y metricas (Modulo 3)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never